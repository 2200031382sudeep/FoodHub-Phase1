{% extends "base.html" %}
{% block title %}Register – FoodExpress{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create your account</h1>
  <form method="post">
    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>
    </div>
    <div class="form-group">
      <label for="password">Password (min 6 characters)</label>
      <input type="password" id="password" name="password" minlength="6" required>
    </div>
    <button type="submit" class="btn">Register</button>
  </form>
  <p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
