{% extends "base.html" %}
{% block title %}{{ title }} – FoodExpress{% endblock %}
{% block content %}
<div class="auth-card wide">
  <h1>{{ title }}</h1>
  <form method="post">
    <div class="form-group">
      <label for="name">Restaurant name</label>
      <input type="text" id="name" name="name" value="{{ r.name or '' }}" maxlength="120" required>
    </div>
    <div class="form-group">
      <label for="cuisine">Cuisine (e.g. Pizza, Biryani, Chinese)</label>
      <input type="text" id="cuisine" name="cuisine" value="{{ r.cuisine or '' }}" maxlength="120" required>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ r.address or '' }}" maxlength="255" required>
    </div>
    <div class="form-group">
      <label for="image_url">Image link (optional, starts with https://)</label>
      <input type="url" id="image_url" name="image_url" value="{{ r.image_url or '' }}" maxlength="255">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="rating">Rating (0–5)</label>
        <input type="number" id="rating" name="rating" step="0.1" min="0" max="5" value="{{ r.rating if r.rating is not none else 4.0 }}">
      </div>
      <div class="form-group">
        <label for="delivery_time">Delivery time (minutes)</label>
        <input type="number" id="delivery_time" name="delivery_time" min="5" max="180" value="{{ r.delivery_time or 30 }}">
      </div>
    </div>
    <label class="check"><input type="checkbox" name="is_active" {% if r.is_active %}checked{% endif %}> Visible to customers</label>
    <button type="submit" class="btn">Save</button>
    <p class="auth-switch"><a href="{{ url_for('admin.dashboard') }}">Cancel</a></p>
  </form>
</div>
{% endblock %}
